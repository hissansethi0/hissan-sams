<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Student Attendance system</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">STUDENT ATTENDANCE SYSTEM</h1>

        <div class="date-section">
            <label for="attendanceDate">Select Date: </label>
            <input type="date" id="attendanceDate">
        </div>

        <div class="input-section">
            <input type="text" id="studentName" placeholder="Enter Student Name">
            <button class="add-btn" onclick="addStudent()">Add Student</button>
        </div>

        <div class="bulk-section">
            <div class="bulk-group">
                <span>Selected students are:</span>
                <button class="b-btn present-outline" onclick="markSelected('Present')">Present</button>
                <button class="b-btn absent-outline" onclick="markSelected('Absent')">Absent</button>
                <button class="b-btn leave-outline" onclick="markSelected('Leave')">Leave</button>
            </div>
        </div>

        <table id="attendanceTable">
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                    <th>Roll No</th>
                    <th>Student Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <footer>&copy; Made with &hearts; by FG PUBLIC SCHOOL (BOYS) KHYBER PESHAWAR CANTT</footer>
    <script src="script.js"></script>
</body>
</html>
